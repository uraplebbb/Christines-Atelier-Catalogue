<main class="page active item-page">
  <div class="wrap">
    <a href="collection.html" class="back-link">← Back to Archive</a>

    <div class="item-layout">
      <!-- Left: Large Image -->
      <div class="item-media">
        <div class="item-carousel" id="itemCarousel" aria-label="Collection images">
          <div class="item-large-frame">
            <img class="carousel-slide is-active" src="https://picsum.photos/seed/the-veil-main/900/1100" alt="The Veil">
            <img class="carousel-slide" src="https://picsum.photos/seed/the-veil-d1/900/1100" alt="The Veil detail">
            <img class="carousel-slide" src="https://picsum.photos/seed/the-veil-d2/900/1100" alt="The Veil detail">
          </div>
          <div class="carousel-dots" role="tablist" aria-label="Choose image">
            <button class="carousel-dot" type="button" role="tab" aria-label="Image 1" aria-selected="true"></button>
            <button class="carousel-dot" type="button" role="tab" aria-label="Image 2" aria-selected="false"></button>
            <button class="carousel-dot" type="button" role="tab" aria-label="Image 3" aria-selected="false"></button>
          </div>
        </div>
      </div>

      <!-- Right: Product Details -->
      <div class="item-info">
        <div class="item-no">No. 04</div>
        <h1>The Veil</h1>
        <div class="item-year">2026</div>

        <div class="item-desc">
          <p>Wool / silk / wire</p>
          <p>Hand-formed in the atelier.</p>
        </div>

        <div class="details-list">
          <div class="d-row"><span>Material</span><span>Wool, silk, wire</span></div>
          <div class="d-row"><span>Technique</span><span>Hand-blocked, stitched</span></div>
          <div class="d-row"><span>Dimensions</span><span>One size (custom fit available)</span></div>
          <div class="d-row"><span>Availability</span><span>Enquire</span></div>
        </div>

        <a href="#" class="arrow-link" id="enquireBtn" target="_blank" rel="noopener">Enquire →</a>
      </div>
    </div>

  </div>
</main>

<script src="js/script.js"></script>
