<header class="site-nav" id="siteNav">

    <!-- Massive Header -->
    <div class="journal-head">
      <div class="eyebrow">Notes from the studio</div>
      <h1>Journal</h1>
    </div>

    <!-- Split Layout: Sidebar + Flower + Content -->
    <div class="journal-body">
      
      <!-- Left Sidebar: Categories + Flower -->
      <div class="journal-side">
        <div class="journal-cats" id="journalCats">
          <button class="jcat active">All</button>
          <button class="jcat">Process</button>
          <button class="jcat">Material</button>
          <button class="jcat">Editorial</button>
          <button class="jcat">Culture</button>
          <button class="jcat">Atelier</button>
        </div>

        <!-- The Hand Drawn Flower SVG -->
        <div class="flower-sketch">
          <svg viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M100 290 C 90 200, 110 150, 100 100" stroke="var(--stone)" stroke-width="1.5" fill="none"/>
            <path d="M100 200 C 70 180, 50 160, 60 140 C 80 150, 90 170, 100 180" stroke="var(--stone)" stroke-width="1" fill="none"/>

            <path d="M100 90 C 90 70, 100 40, 100 30 C 100 40, 110 70, 100 90" stroke="var(--stone)" stroke-width="1.5" fill="none"/>
            <path d="M40 120 C 30 90, 60 70, 50 50" stroke="var(--stone)" stroke-width="1.5" fill="none"/>
            <path d="M40 120 C 40 100, 25 85, 30 70" stroke="var(--stone)" stroke-width="1.5" fill="none"/>
          </svg>
        </div>
      </div>

      <!-- Right: The Articles List -->
      <div class="journal-list" id="journalList">
        <!-- Journal Articles are added here via JS -->
      </div>

    </div>

  </div>
</main>

<script src="js/script.js"></script>
